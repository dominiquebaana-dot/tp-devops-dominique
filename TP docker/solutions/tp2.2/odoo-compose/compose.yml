services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [odoo_network]

  odoo:
    image: odoo:18.0
    depends_on: [db]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    networks: [odoo_network]

networks:
  odoo_network:

volumes:
  db-data:
  odoo-data:
