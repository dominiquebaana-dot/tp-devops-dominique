---
# TP 5.6 Étape 7 : WordPress sur Kubernetes piloté par Ansible + Vault
- name: WordPress sur Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ '/opt/k8s-python/bin/python' if '/opt/k8s-python/bin/python' is file else ansible_playbook_python }}"

  vars_files:
    - vars/wordpress_secrets.yml

  tasks:
    - name: Namespace blog
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: blog

    - name: Secret MySQL depuis Vault
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mysql-pass
            namespace: blog
          stringData:
            password: "{{ mysql_root_password }}"
      no_log: true

    - name: Manifests MySQL, WordPress et Service
      kubernetes.core.k8s:
        state: present
        src: "{{ item }}"
        namespace: blog
        wait: true
        wait_timeout: 300
      loop:
        - k8s-wordpress/mysql-deployment.yaml
        - k8s-wordpress/wordpress-deployment.yaml
        - k8s-wordpress/wordpress-service.yaml
