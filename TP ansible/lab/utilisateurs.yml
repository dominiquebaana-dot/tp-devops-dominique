---
# Défi TP 5.3 : Gestion des comptes utilisateurs, clés SSH et droits sudoers conditionnels
- name: Gestion des comptes
  hosts: lab
  become: true

  tasks:
    - name: S'assurer que les groupes cibles existent
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: "{{ comptes | map(attribute='groupe') | unique }}"

    - name: Créer / supprimer les comptes
      ansible.builtin.user:
        name: "{{ item.nom }}"
        groups: "{{ item.groupe }}"
        shell: /bin/bash
        state: "{{ item.etat | default('present') }}"
        remove: "{{ (item.etat | default('present')) == 'absent' }}"
      loop: "{{ comptes }}"
      loop_control:
        label: "{{ item.nom }}"

    - name: Installer les clés SSH
      ansible.posix.authorized_key:
        user: "{{ item.nom }}"
        key: "{{ item.cle }}"
      loop: "{{ comptes | selectattr('cle', 'defined') | selectattr('etat', 'ne', 'absent') }}"
      loop_control:
        label: "{{ item.nom }}"

    - name: Droits sudo pour les ops uniquement sur les serveurs db
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ item.nom }}"
        content: "{{ item.nom }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: visudo -cf %s
      loop: "{{ comptes | selectattr('groupe', 'eq', 'operations') | selectattr('etat', 'ne', 'absent') }}"
      loop_control:
        label: "{{ item.nom }}"
      when: "'db' in group_names"
