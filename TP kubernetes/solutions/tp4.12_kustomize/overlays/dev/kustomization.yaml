apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: legeni-dev-kustomize
resources:
  - ../../base
labels:
  - pairs:
      env: dev
patches:
  - path: dev-patch.yaml
images:
  - name: legeni-webapp
    newName: legeni-webapp
    newTag: "1.0.0"
configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_COLOR=#1f6feb
