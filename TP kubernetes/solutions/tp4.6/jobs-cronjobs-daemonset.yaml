apiVersion: v1
kind: Namespace
metadata:
  name: batch
---
# Service applicatif cible pour controle-sante (Étape 4) et sauvegarde (Étape 5)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: batch
spec:
  replicas: 1
  selector:
    matchLabels: { app: webapp }
  template:
    metadata:
      labels: { app: webapp }
    spec:
      containers:
        - name: webapp
          image: legeni-webapp:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: batch
spec:
  selector: { app: webapp }
  ports: [{ port: 80, targetPort: 5000 }]
---
# Étape 1 : Job simple (calcul de Pi)
apiVersion: batch/v1
kind: Job
metadata:
  name: calcul-pi
  namespace: batch
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pi
          image: perl:5.40-slim
          command: ["perl", "-Mbignum=bpi", "-wle", "print bpi(500)"]
---
# Étape 3 : Job parallèle indexé (6 lots, 2 en parallèle)
apiVersion: batch/v1
kind: Job
metadata:
  name: traitement-lots
  namespace: batch
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: lot
          image: busybox:1.36
          command: ["sh", "-c", "echo \"Traitement du lot $JOB_COMPLETION_INDEX sur $(hostname)\"; sleep 2"]
---
# Étape 4 : CronJob de contrôle de santé
apiVersion: batch/v1
kind: CronJob
metadata:
  name: controle-sante
  namespace: batch
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.11.1
              command: ["sh", "-c", "date; curl -sf --max-time 5 http://webapp/health && echo ' -> OK'"]
---
# Étape 5 : PVC + CronJob de sauvegarde avec rotation des 5 derniers fichiers
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sauvegardes
  namespace: batch
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sauvegarde
  namespace: batch
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sauvegarde
              image: busybox:1.36
              command:
                - sh
                - -ec
                - |
                  F=/backup/info-$(date +%Y%m%d-%H%M).json
                  wget -qO "$F" http://webapp/api/info && echo "Sauvegarde : $F"
                  ls -1t /backup/*.json | tail -n +6 | xargs -r rm
                  ls -l /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: sauvegardes
---
# Étape 6 : DaemonSet (1 agent par nœud)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent-noeud
  namespace: batch
spec:
  selector:
    matchLabels:
      app: agent-noeud
  template:
    metadata:
      labels:
        app: agent-noeud
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date) noeud=$NODE_NAME pods_logs=$(ls /var/log/pods 2>/dev/null | wc -l)\"; sleep 30; done"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
---
# Étape 7 : Deployment avec initContainer (attendre-redis)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-redis
  namespace: batch
spec:
  replicas: 1
  selector:
    matchLabels: { app: webapp-redis }
  template:
    metadata:
      labels: { app: webapp-redis }
    spec:
      initContainers:
        - name: attendre-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo 'Redis indisponible, attente...'; sleep 2; done; echo 'Redis OK'"]
      containers:
        - name: webapp
          image: legeni-webapp:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis
          ports: [{ containerPort: 5000 }]
---
# Défi TP 4.6 : Job de migration initialisant le compteur Redis à 1000
apiVersion: batch/v1
kind: Job
metadata:
  name: migration-compteur
  namespace: batch
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: attendre-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
      containers:
        - name: migration
          image: redis:7.4-alpine
          command: ["redis-cli", "-h", "redis", "SET", "visits", "1000"]
