# Stack complète legeni-dev couvrant les TPs 4.7, 4.8, 4.9, 4.10 et 4.11 (y compris les Défis)
apiVersion: v1
kind: Namespace
metadata:
  name: legeni-dev
  labels:
    env: dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: legeni-dev
  labels:
    env: dev
data:
  APP_ENV: "dev"
  APP_COLOR: "#1f6feb"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
---
# TP 4.10 + Défi TP 4.9 : Redis en StatefulSet avec PVC 1Gi, probes et ressources
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: legeni-dev
  labels:
    app: redis
    env: dev
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        env: dev
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: redis
          env: dev
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: legeni-dev
  labels:
    app: redis
    env: dev
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
---
# TP 4.7 + 4.8 + 4.9 : Deployment webapp (RollingUpdate maxUnavailable=0, probes, resources)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: legeni-dev
  labels:
    app: webapp
    env: dev
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        env: dev
    spec:
      containers:
        - name: webapp
          image: legeni-webapp:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: webapp-config
            - secretRef:
                name: redis-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: legeni-dev
  labels:
    app: webapp
    env: dev
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
---
# TP 4.8 : HorizontalPodAutoscaler (HPA)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webapp
  namespace: legeni-dev
  labels:
    env: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webapp
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# TP 4.11 : Ingress avec routage par nom d'hôte et TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legeni
  namespace: legeni-dev
  labels:
    env: dev
spec:
  ingressClassName: nginx
  tls:
    - hosts: [legeni.local]
      secretName: legeni-tls
  rules:
    - host: legeni.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
